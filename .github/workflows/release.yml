name: Build and Release Rust Binaries

on:
  push:
    branches: [dev]
    tags:
      - 'rc-*'
      - 'release-*'
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-macos-arm64:
    uses: bbusse/github-workflows/.github/workflows/build-rust.yml@dev
    with:
      binary_name: vju
      artifact_name: vju
      musl: true

  build-freebsd:
    uses: bbusse/github-workflows/.github/workflows/build-rust-pkg-freebsd.yml@dev
    with:
      binary_name: vju
      artifact_name: vju

  release:
    needs:
      - build-macos-arm64
      - build-freebsd
      - build-apk
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: bbusse/github-workflows/.github/workflows/release.yml@dev
    with:
      artifact_name: vju
      binary_name: vju
      release_branch: ci
      version_branch: dev
      cargo_toml_path: Cargo.toml
    secrets: inherit

  compute-version:
    if: startsWith(github.ref, 'refs/tags/')
    uses: bbusse/github-workflows/.github/workflows/compute-version.yml@dev
    with:
      version_branch: dev
      cargo_toml_path: Cargo.toml

  build-apk:
    needs:
      - build-macos-arm64
      - compute-version
    if: startsWith(github.ref, 'refs/tags/')
    uses: bbusse/github-workflows/.github/workflows/build-apk.yml@dev
    with:
      artifact_name: vju
      build_from_source: true
      version: ${{ needs.compute-version.outputs.version }}
      key_name: apk-releases
    secrets: inherit

  build-gentoo-pkg:
    needs:
      - compute-version
    if: startsWith(github.ref, 'refs/tags/')
    uses: bbusse/github-workflows/.github/workflows/build-gentoo-pkg.yml@dev
    with:
      overlay_repo: bbusse/bbusse-overlay
      ebuild_path: x11-misc/vju/vju-0.1.0.ebuild
      artifact_name: vju
      version: ${{ needs.compute-version.outputs.version }}
      disable: true
